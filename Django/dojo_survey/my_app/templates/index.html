<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dojo Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="card-title mb-4">Dojo Survey</h1>
              <form action="/result" method="post">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input type="text" class="form-control" id="name" name="name" placeholder="Your name" />
                </div>

                <div class="mb-3">
                  <label for="dojo_location" class="form-label">Dojo Location</label>
                  <select class="form-select" id="dojo_location" name="dojo_location">
                    <option value="Al-Quds">Al-Quds</option>
                    <option value="Ramallah">Ramallah</option>
                    <option value="Gaza">Gaza</option>
                  </select>
                </div>

                <div class="mb-3">
                  <label class="form-label">Favorite Language</label>
                  <div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="favorite_language" id="lang_python" value="Python" />
                      <label class="form-check-label" for="lang_python">Python</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="favorite_language" id="lang_javascript" value="JavaScript" />
                      <label class="form-check-label" for="lang_javascript">JavaScript</label>
                    </div>
                    <div class="form-check form-check-inline">
                      <input class="form-check-input" type="radio" name="favorite_language" id="lang_php" value="PHP" />
                      <label class="form-check-label" for="lang_php">PHP</label>
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">Languages Known (checkboxes)</label>
                  <div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" name="languages_known" id="chk_python" value="Python" />
                      <label class="form-check-label" for="chk_python">Python</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" name="languages_known" id="chk_js" value="JavaScript" />
                      <label class="form-check-label" for="chk_js">JavaScript</label>
                    </div>
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" name="languages_known" id="chk_php" value="PHP" />
                      <label class="form-check-label" for="chk_php">PHP</label>
                    </div>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="comment" class="form-label">Comment</label>
                  <textarea class="form-control" id="comment" name="comment" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
