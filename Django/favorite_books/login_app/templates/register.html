{% extends 'base.html' %}

{% block title %}
  Register — SimpleAuth
{% endblock %}

{% block content %}
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title mb-3">Create account</h3>
            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-warning py-2">{{ message }}</div>
              {% endfor %}
            {% endif %}

            <form action="{% url 'register' %}" method="post" id="registerForm" novalidate>
              {% csrf_token %}
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" value="{{ old_data.username }}" autocomplete="username" />
                <div id="username_error" class="form-text text-danger"></div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-control" value="{{ old_data.email }}" autocomplete="email" />
                <div id="email_error" class="form-text text-danger"></div>
              </div>

              <div class="mb-3">
                <label for="birthday" class="form-label">Birthday</label>
                <input type="date" id="birthday" name="birthday" class="form-control" value="{{ old_data.birthday }}" />
                <div id="birthday_error" class="form-text text-danger"></div>
              </div>

              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" autocomplete="new-password" />
                <div id="password_error" class="form-text text-danger"></div>
              </div>

              <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" autocomplete="new-password" />
                <div id="confirm_password_error" class="form-text text-danger"></div>
              </div>

              <div class="d-grid mb-2">
                <button type="submit" class="btn btn-primary">Create account</button>
              </div>

              <div class="text-center">
                <a href="{% url 'login' %}">Already have an account?</a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  <script>
    const form = document.getElementById('registerForm')
    const usernameField = document.getElementById('username')
    const emailField = document.getElementById('email')
    const birthdayField = document.getElementById('birthday')
    const passwordField = document.getElementById('password')
    const confirmPasswordField = document.getElementById('confirm_password')
    
    function setError(field, message) {
      const errorElement = document.getElementById(`${field.id}_error`)
      errorElement.textContent = message || ''
    }
    
    function validateEmailFormat(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    }
    
    function calculateAge(birthDate) {
      const today = new Date()
      const birth = new Date(birthDate)
      let age = today.getFullYear() - birth.getFullYear()
      const monthDiff = today.getMonth() - birth.getMonth()
      const dayDiff = today.getDate() - birth.getDate()
      if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
        age -= 1
      }
      return age
    }
    
    async function checkEmailAvailable(email) {
      if (!validateEmailFormat(email)) {
        setError(emailField, 'Enter a valid email address.')
        return false
      }
    
      try {
        const response = await fetch(`{% url 'check_email' %}?email=${encodeURIComponent(email)}`)
        const data = await response.json()
        if (data.exists) {
          setError(emailField, 'Email is already registered.')
          return false
        }
        setError(emailField, '')
        return true
      } catch (e) {
        // If network check fails, allow server-side to handle uniqueness
        return true
      }
    }
    
    async function validateForm() {
      let valid = true
    
      if (usernameField.value.trim().length < 3) {
        setError(usernameField, 'Username must be at least 3 characters long.')
        valid = false
      } else {
        setError(usernameField, '')
      }
    
      if (!emailField.value.trim() || !validateEmailFormat(emailField.value.trim())) {
        setError(emailField, 'Enter a valid email address.')
        valid = false
      } else {
        const emailAvailable = await checkEmailAvailable(emailField.value.trim())
        if (!emailAvailable) valid = false
      }
    
      if (!birthdayField.value) {
        setError(birthdayField, 'Birthday is required.')
        valid = false
      } else {
        const age = calculateAge(birthdayField.value)
        if (age < 0) {
          setError(birthdayField, 'Birthday cannot be in the future.')
          valid = false
        } else if (age < 13) {
          setError(birthdayField, 'You must be at least 13 years old.')
          valid = false
        } else {
          setError(birthdayField, '')
        }
      }
    
      if (passwordField.value.length < 8) {
        setError(passwordField, 'Password must be at least 8 characters long.')
        valid = false
      } else {
        setError(passwordField, '')
      }
    
      if (confirmPasswordField.value !== passwordField.value) {
        setError(confirmPasswordField, 'Passwords do not match.')
        valid = false
      } else {
        setError(confirmPasswordField, '')
      }
    
      return valid
    }
    
    emailField.addEventListener('blur', () => {
      if (emailField.value.trim()) {
        checkEmailAvailable(emailField.value.trim())
      }
    })
    
    form.addEventListener('submit', async function (event) {
      event.preventDefault()
      const isValid = await validateForm()
      if (isValid) {
        form.submit()
      }
    })
  </script>
{% endblock %}
