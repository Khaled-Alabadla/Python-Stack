{% extends 'base.html' %}

{% block title %}
  Login — SimpleAuth
{% endblock %}

{% block content %}
  <h2 class="text-xl font-semibold mb-4">Login</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded mb-3">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form action="{% url 'login' %}" method="post" id="loginForm" novalidate>
    {% csrf_token %}
    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="email_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="password_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md font-semibold">Sign in</button>
    <div class="flex justify-between mt-3 text-sm">
      <a class="text-gray-500" href="{% url 'register' %}">Create account</a>
    </div>
  </form>
{% endblock %}

{% block scripts %}
  <script>
    const loginForm = document.getElementById('loginForm')
    const emailField = document.getElementById('email')
    const passwordField = document.getElementById('password')
    
    function setError(field, message) {
      const errorElement = document.getElementById(`${field.id}_error`)
      errorElement.textContent = message || ''
    }
    
    function validateEmailFormat(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    }
    
    loginForm.addEventListener('submit', function (event) {
      event.preventDefault()
      let valid = true
    
      if (!emailField.value.trim() || !validateEmailFormat(emailField.value.trim())) {
        setError(emailField, 'Enter a valid email address.')
        valid = false
      } else {
        setError(emailField, '')
      }
    
      if (!passwordField.value.trim()) {
        setError(passwordField, 'Password is required.')
        valid = false
      } else {
        setError(passwordField, '')
      }
    
      if (valid) {
        loginForm.submit()
      }
    })
  </script>
{% endblock %}
