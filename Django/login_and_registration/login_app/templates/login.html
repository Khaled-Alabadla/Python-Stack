{% extends 'base.html' %}

{% block title %}
  Login — SimpleAuth
{% endblock %}

{% block content %}
  <h2 style="color: #fff">Login</h2>

  {% if messages %}
    {% for message in messages %}
      <p class="error">{{ message }}</p>
    {% endfor %}
  {% endif %}

  <form action="{% url 'login' %}" method="post" id="loginForm" novalidate>
    {% csrf_token %}
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" />
      <span id="email_error" class="error"></span>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" />
      <span id="password_error" class="error"></span>
    </div>

    <button type="submit">Sign in</button>
    <div class="actions">
      <a class="muted-link" href="{% url 'register' %}">Create account</a>
    </div>
  </form>
{% endblock %}

{% block scripts %}
  <script>
    const loginForm = document.getElementById('loginForm')
    const emailField = document.getElementById('email')
    const passwordField = document.getElementById('password')
    
    function setError(field, message) {
      const errorElement = document.getElementById(`${field.id}_error`)
      errorElement.textContent = message || ''
    }
    
    function validateEmailFormat(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    }
    
    loginForm.addEventListener('submit', function (event) {
      event.preventDefault()
      let valid = true
    
      if (!emailField.value.trim() || !validateEmailFormat(emailField.value.trim())) {
        setError(emailField, 'Enter a valid email address.')
        valid = false
      } else {
        setError(emailField, '')
      }
    
      if (!passwordField.value.trim()) {
        setError(passwordField, 'Password is required.')
        valid = false
      } else {
        setError(passwordField, '')
      }
    
      if (valid) {
        loginForm.submit()
      }
    })
  </script>
{% endblock %}
