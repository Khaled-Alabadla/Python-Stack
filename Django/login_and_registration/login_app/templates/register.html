{% extends 'base.html' %}

{% block title %}
  Register — SimpleAuth
{% endblock %}

{% block content %}
  <h2 class="text-xl font-semibold mb-4">Register</h2>

  {% if messages %}
    {% for message in messages %}
      <div class="bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded mb-3">{{ message }}</div>
    {% endfor %}
  {% endif %}

  <form action="{% url 'register' %}" method="post" id="registerForm" novalidate>
    {% csrf_token %}
    <div class="mb-4">
      <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
      <input type="text" id="username" name="username" value="{{ old_data.username }}" autocomplete="username" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="username_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-4">
      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input type="email" id="email" name="email" value="{{ old_data.email }}" autocomplete="email" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="email_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-4">
      <label for="birthday" class="block text-sm font-medium text-gray-700">Birthday</label>
      <input type="date" id="birthday" name="birthday" value="{{ old_data.birthday }}" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="birthday_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-4">
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="password_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <div class="mb-4">
      <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm px-3 py-2" />
      <p id="confirm_password_error" class="text-sm text-red-600 mt-1"></p>
    </div>

    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-md font-semibold">Create account</button>
    <div class="flex justify-between mt-3 text-sm">
      <a class="text-gray-500" href="{% url 'login' %}">Already have an account?</a>
    </div>
  </form>
{% endblock %}

{% block scripts %}
  <script>
    const form = document.getElementById('registerForm')
    const usernameField = document.getElementById('username')
    const emailField = document.getElementById('email')
    const birthdayField = document.getElementById('birthday')
    const passwordField = document.getElementById('password')
    const confirmPasswordField = document.getElementById('confirm_password')
    
    function setError(field, message) {
      const errorElement = document.getElementById(`${field.id}_error`)
      errorElement.textContent = message || ''
    }
    
    function validateEmailFormat(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
    }
    
    function calculateAge(birthDate) {
      const today = new Date()
      const birth = new Date(birthDate)
      let age = today.getFullYear() - birth.getFullYear()
      const monthDiff = today.getMonth() - birth.getMonth()
      const dayDiff = today.getDate() - birth.getDate()
      if (monthDiff < 0 || (monthDiff === 0 && dayDiff < 0)) {
        age -= 1
      }
      return age
    }
    
    async function checkEmailAvailable(email) {
      if (!validateEmailFormat(email)) {
        setError(emailField, 'Enter a valid email address.')
        return false
      }
    
      try {
        const response = await fetch(`{% url 'check_email' %}?email=${encodeURIComponent(email)}`)
        const data = await response.json()
        if (data.exists) {
          setError(emailField, 'Email is already registered.')
          return false
        }
        setError(emailField, '')
        return true
      } catch (e) {
        // If network check fails, allow server-side to handle uniqueness
        return true
      }
    }
    
    async function validateForm() {
      let valid = true
    
      if (usernameField.value.trim().length < 3) {
        setError(usernameField, 'Username must be at least 3 characters long.')
        valid = false
      } else {
        setError(usernameField, '')
      }
    
      if (!emailField.value.trim() || !validateEmailFormat(emailField.value.trim())) {
        setError(emailField, 'Enter a valid email address.')
        valid = false
      } else {
        const emailAvailable = await checkEmailAvailable(emailField.value.trim())
        if (!emailAvailable) valid = false
      }
    
      if (!birthdayField.value) {
        setError(birthdayField, 'Birthday is required.')
        valid = false
      } else {
        const age = calculateAge(birthdayField.value)
        if (age < 0) {
          setError(birthdayField, 'Birthday cannot be in the future.')
          valid = false
        } else if (age < 13) {
          setError(birthdayField, 'You must be at least 13 years old.')
          valid = false
        } else {
          setError(birthdayField, '')
        }
      }
    
      if (passwordField.value.length < 8) {
        setError(passwordField, 'Password must be at least 8 characters long.')
        valid = false
      } else {
        setError(passwordField, '')
      }
    
      if (confirmPasswordField.value !== passwordField.value) {
        setError(confirmPasswordField, 'Passwords do not match.')
        valid = false
      } else {
        setError(confirmPasswordField, '')
      }
    
      return valid
    }
    
    emailField.addEventListener('blur', () => {
      if (emailField.value.trim()) {
        checkEmailAvailable(emailField.value.trim())
      }
    })
    
    form.addEventListener('submit', async function (event) {
      event.preventDefault()
      const isValid = await validateForm()
      if (isValid) {
        form.submit()
      }
    })
  </script>
{% endblock %}
