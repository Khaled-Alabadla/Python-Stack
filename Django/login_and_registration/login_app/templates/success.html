{% extends 'base.html' %}

{% block title %}
  Welcome — SimpleAuth
{% endblock %}

{% block content %}
  <h2 class="text-xl font-semibold mb-3">Welcome!</h2>
  <p>You have successfully registered and logged in.</p>

  <form action="{% url 'logout' %}" method="post">
    {% csrf_token %}
    <button type="submit" class="mt-3 w-full border border-gray-300 rounded-md py-2 text-gray-700 hover:bg-gray-50">Logout</button>
  </form>
{% endblock %}
