<!DOCTYPE html>
<html>
  <head>
    <title>Ninja Gold - Game Setup</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      
      .container {
        background-color: white;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 100%;
      }
      
      .header {
        text-align: center;
        margin-bottom: 40px;
      }
      
      .header h1 {
        font-size: 48px;
        margin-bottom: 10px;
      }
      
      .header p {
        color: #666;
        font-size: 16px;
      }
      
      .form-group {
        margin-bottom: 25px;
      }
      
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #333;
        font-size: 16px;
      }
      
      .form-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #ddd;
        border-radius: 4px;
        font-size: 16px;
        transition: border-color 0.3s;
      }
      
      .form-group input:focus {
        outline: none;
        border-color: #667eea;
      }
      
      .form-group small {
        display: block;
        margin-top: 5px;
        color: #999;
        font-size: 14px;
      }
      
      .button-group {
        display: flex;
        gap: 10px;
        justify-content: center;
      }
      
      button {
        padding: 12px 30px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s;
      }
      
      .btn-start {
        background-color: #28a745;
        color: white;
        flex: 1;
      }
      
      .btn-start:hover {
        background-color: #218838;
        transform: scale(1.02);
      }
      
      .description {
        background-color: #f9f9f9;
        padding: 15px;
        border-radius: 4px;
        margin-bottom: 30px;
        border-left: 4px solid #667eea;
      }
      
      .description h3 {
        margin-bottom: 8px;
        color: #333;
      }
      
      .description p {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🥋 Ninja Gold</h1>
        <p>Configure Your Challenge</p>
      </div>

      <div class="description">
        <h3>How to Play:</h3>
        <p>Set your goal amount and move limit, then visit different locations to earn gold. Can you reach your goal before running out of moves?</p>
      </div>

      <form method="POST">
        {% csrf_token %}

        <div class="form-group">
          <label for="goal_gold">Goal Amount (gold):</label>
          <input type="number" id="goal_gold" name="goal_gold" value="100" min="1" required />
          <small>How much gold do you need to earn to win?</small>
        </div>

        <div class="form-group">
          <label for="max_moves">Move Limit:</label>
          <input type="number" id="max_moves" name="max_moves" value="20" min="1" required />
          <small>How many activity attempts do you get?</small>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-start">Start Game</button>
        </div>
      </form>
    </div>
  </body>
</html>
