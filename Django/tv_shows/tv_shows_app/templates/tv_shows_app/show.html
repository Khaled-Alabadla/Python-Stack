<!DOCTYPE html>
<html>
  <head>
    <title>TV Show {{ show.id }}</title>
  </head>
  <body>
    <p>
      <a href="/shows/">Go Back</a>
    </p>
    <h1>TV Show {{ show.id }}</h1>
    <p>
      <strong>Title:</strong> {{ show.title }}
    </p>
    <p>
      <strong>Network:</strong> {{ show.network }}
    </p>
    <p>
      <strong>Release Date:</strong> {{ show.release_date }}
    </p>
    <p>
      <strong>Description:</strong> {{ show.description }}
    </p>
    <p>
      <a href="/shows/{{ show.id }}/edit">Edit</a>
      |<form action="/shows/{{ show.id }}/destroy" method="post" style="display:inline">
        {% csrf_token %}
        <button type="submit" onclick="return confirm('Delete this show?')">Delete</button>
      </form>
    </p>
  </body>
</html>
