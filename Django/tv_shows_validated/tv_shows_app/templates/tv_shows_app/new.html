{% extends 'tv_shows_app/base.html' %}

{% block title %}Add a New Show — TV Shows{% endblock %}

{% block content %}
  <div class="mb-6">
    <a href="/shows/" class="text-indigo-600 hover:underline">← Back to list</a>
  </div>

  <div class="bg-white shadow rounded p-6">
    <h2 class="text-2xl font-semibold mb-4">Add a New Show</h2>

    {% if messages %}
      <div class="mb-4">
        {% for message in messages %}
          <div class="text-sm text-red-600">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}

    <form action="/shows/create" method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700">Title</label>
        <input type="text" name="title" required class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Network</label>
        <input type="text" name="network" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Release Date</label>
        <input type="date" name="release_date" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Description</label>
        <textarea name="description" rows="4" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm"></textarea>
      </div>

      <div class="pt-4">
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">Create</button>
      </div>
    </form>
  </div>
{% endblock %}
