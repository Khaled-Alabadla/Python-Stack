<!DOCTYPE html>
<html>
  <head>
    <title>All Shows</title>
  </head>
  <body>
    <h1>All Shows</h1>
    <p>
      <a href="/shows/new">Add a New Show</a>
    </p>
    <table border="1" cellpadding="6" cellspacing="0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Network</th>
          <th>Release Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for show in shows %}
          <tr>
            <td>{{ show.id }}</td>
            <td>{{ show.title }}</td>
            <td>{{ show.network }}</td>
            <td>{{ show.release_date }}</td>
            <td>
              <a href="/shows/{{ show.id }}/">Show</a> |
              <a href="/shows/{{ show.id }}/edit">Edit</a> |<form action="/shows/{{ show.id }}/destroy" method="post" style="display:inline">
                {% csrf_token %}
                <button type="submit" onclick="return confirm('Delete this show?')">Delete</button>
              </form>
            </td>
          </tr>
        {% empty %}
          <tr>
            <td colspan="5">No shows yet.</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
