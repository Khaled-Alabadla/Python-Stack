<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>
      {% block title %}
        TV Shows
      {% endblock %}
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <header class="bg-white shadow">
      <div class="max-w-4xl mx-auto px-4 py-6 flex items-center justify-between">
        <a href="/shows/" class="text-2xl font-semibold text-indigo-600">TV Shows</a>
        <nav class="space-x-4">
          <a href="/shows/" class="text-gray-600 hover:text-indigo-600">All Shows</a>
          <a href="/shows/new" class="text-gray-600 hover:text-indigo-600">Add Show</a>
        </nav>
      </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
      {% block content %}
      {% endblock %}
    </main>

    <footer class="mt-12 py-6 bg-white">
      <div class="max-w-4xl mx-auto px-4 text-sm text-center text-gray-500">Built with ♥ — Khaled Alabadla</div>
    </footer>
  </body>
</html>
