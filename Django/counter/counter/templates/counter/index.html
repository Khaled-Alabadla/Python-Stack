<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Session Counter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 700px;
        margin: 2rem auto;
        line-height: 1.6;
        padding: 0 1rem;
      }
      
      .button-group {
        margin: 1rem 0;
      }
      
      .button-group form,
      .button-group a {
        display: inline-block;
        margin-right: 0.5rem;
      }
      
      button,
      .button-link {
        padding: 0.6rem 1rem;
        border: none;
        background: #1f6feb;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        cursor: pointer;
      }
      
      button:hover,
      .button-link:hover {
        background: #145dbf;
      }
      
      input[type='number'] {
        width: 5rem;
        padding: 0.4rem;
        margin-right: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Session Counter</h1>

    <p>
      You have visited this page <strong>{{ visits }}</strong> time{{ visits|pluralize }}.
    </p>
    <p>
      The current counter value is <strong>{{ counter }}</strong>.
    </p>

    <div class="button-group">
      <form action="{% url 'increment2' %}" method="get">
        <button type="submit">+2</button>
      </form>
      <a class="button-link" href="{% url 'destroy_session' %}">Reset</a>
    </div>

    <h2>Increment by a custom amount</h2>
    <form method="post" action="{% url 'index' %}">
      {% csrf_token %}
      <label for="increment_value">Increment by:</label>
      <input id="increment_value" name="increment_value" type="number" value="1" min="1" />
      <button type="submit">Apply</button>
    </form>
  </body>
</html>
