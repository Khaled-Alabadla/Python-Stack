<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirm Delete</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: #f1f5f9;
        display: grid;
        place-items: center;
        min-height: 100vh;
        color: #0f172a;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 28px;
        width: min(520px, 100%);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }
      h1 {
        margin-top: 0;
      }
      p {
        color: #475569;
        line-height: 1.7;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }
      .btn,
      .link-btn {
        padding: 12px 20px;
        border-radius: 14px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        text-decoration: none;
      }
      .btn {
        background: #ef4444;
        color: white;
      }
      .link-btn {
        background: #e2e8f0;
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Confirm Delete</h1>
      <p>Are you sure you want to delete the comment “{{ comment.content }}”?</p>
      <form action="{% url 'delete_comment' pk=comment.pk %}" method="post">
        {% csrf_token %}
        <div class="actions">
          <a class="link-btn" href="{% url 'add_comment' pk=comment.course.pk %}">Cancel</a>
          <button class="btn" type="submit">Yes, delete</button>
        </div>
      </form>
    </div>
  </body>
</html>
